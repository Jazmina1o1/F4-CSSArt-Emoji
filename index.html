<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Rainbow Sky</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="scene" role="group" aria-label="A rainbow with the sun and clouds">
    <div class="scene-background" aria-hidden="true"></div>
    <div class="box">
  <div class="distant-cloud distant-cloud-left" aria-hidden="true"></div>
  <div class="distant-cloud distant-cloud-right" aria-hidden="true"></div>
  <div class="sun" aria-hidden="true"></div>
   <div class="cloud left" aria-hidden="true"></div>
   <div class="rainbow" aria-hidden="true">
   <div class="arc red"></div>
   <div class="arc orange"></div>
  <div class="arc yellow"></div>
    <div class="arc green"></div>
   <div class="arc blue"></div>
     <div class="arc indigo"></div>
     <div class="arc purple"></div>
     </div>
      <div class="cloud right" aria-hidden="true"></div>
    </div>
  </div>

  <div class="scene night-scene" role="group" aria-label="A rainbow with the sun and clouds">
  <div class="scene-background" aria-hidden="true"></div>
  <div class="box">
  <div class="distant-cloud distant-cloud-left" aria-hidden="true"></div>
  <div class="distant-cloud distant-cloud-right" aria-hidden="true"></div>
  <div class="sun" aria-hidden="true"></div>
  <div class="cloud left" aria-hidden="true"></div>
  <div class="rainbow" aria-hidden="true">
  <div class="arc red"></div>
  <div class="arc orange"></div>
   <div class="arc yellow"></div>
  <div class="arc green"></div>
  <div class="arc blue"></div>
  <div class="arc indigo"></div>
  <div class="arc purple"></div>
  </div>
      <div class="cloud right" aria-hidden="true"></div>
    </div>
  </div>

  <div class="scene animated-scene" role="group" aria-label="An animated sky changing from day to night">
    <div class="scene-background" aria-hidden="true"></div>
    <div class="box">
  <div class="distant-cloud distant-cloud-left" aria-hidden="true"></div>
  <div class="distant-cloud distant-cloud-right" aria-hidden="true"></div>
  <div class="sun" aria-hidden="true"></div>
  <div class="moon" aria-hidden="true"></div>
  <div class="cloud left" aria-hidden="true"></div>
  <div class="rainbow" aria-hidden="true">
  <div class="arc red"></div>
  <div class="arc orange"></div>
    <div class="arc yellow"></div>
    <div class="arc green"></div>
   <div class="arc blue"></div>
   <div class="arc indigo"></div>
   <div class="arc purple"></div>
  </div>
  <div class="cloud right" aria-hidden="true"></div>
    </div>
  </div>
  
  <footer>
    <center>
    <p>&copy;Jazmin , 2026</p>
    <img src="https://cmsv2-assets.apptegy.net/uploads/22295/file/6501559/px2560_7fc8dfc1-1a37-48fc-9515-087b9e5c3c15.jpeg" width="300" height="100" style="display:block; margin:0 auto;" alt="HSFI Logo">
      </div>
    </center>
  </footer>
</body>
</html>
