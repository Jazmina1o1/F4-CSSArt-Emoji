<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rainbow Sky</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
   
    <div class="scene" role="group" aria-label="A rainbow with clouds on either side">

        <div class="rainbow" aria-hidden="true">
            <div class="arc red"></div>
            <div class="arc orange"></div>
            <div class="arc yellow"></div>
            <div class="arc green"></div>
            <div class="arc blue"></div>
            <div class="arc indigo"></div>
            <div class="arc purple"></div>
            <div class="arc inside"></div>
        </div>

        <div class="cloud left" aria-hidden="true"></div>
        <div class="cloud right" aria-hidden="true"></div>

    </div>

</body>
</html>
